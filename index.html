<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2.5D Mobile Pixel Fighter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: monospace, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        /* UI Overlays */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-weight: bold;
            font-size: 14px;
            color: #111;
        }

        .bar-container {
            width: 42%;
            background: #eee;
            border: 2px solid #000;
            height: 18px;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            background: #000;
            width: 100%;
            transition: width 0.1s linear;
        }

        .dummy-bar {
            background: #ff4444;
        }

        /* Mobile Controls */
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Joystick */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.05);
            border: 2px dashed #bbb;
            pointer-events: auto;
            touch-action: none;
        }

        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            margin-top: -25px;
            margin-left: -25px;
            border-radius: 50%;
            background: #111;
            border: 2px solid #000;
        }

        /* Buttons */
        .btn-group {
            position: absolute;
            bottom: 30px;
            right: 25px;
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .action-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #111;
            color: #111;
            font-weight: 900;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #111;
            touch-action: manipulation;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #111;
            background: #111;
            color: #fff;
        }

        .btn-atk { width: 75px; height: 75px; font-size: 18px; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div style="width: 45%;">
            PLAYER
            <div class="bar-container"><div id="player-hp" class="bar-fill"></div></div>
        </div>
        <div style="width: 45%; text-align: right;">
            DUMMY
            <div class="bar-container" style="margin-left: auto;"><div id="dummy-hp" class="bar-fill dummy-bar"></div></div>
        </div>
    </div>

    <div id="controls">
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
        <div class="btn-group">
            <button class="action-btn" id="btn-jump">JUMP</button>
            <button class="action-btn" id="btn-skill">SKILL</button>
            <button class="action-btn btn-atk" id="btn-atk">ATK</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- 입력 처리 (가상 조이스틱 & 터치) ---
const input = { x: 0, y: 0, atk: false, skill: false, jump: false };

const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
let joyActive = false;
let joyStart = { x: 0, y: 0 };
const joyMaxRadius = 40;

joyZone.addEventListener('touchstart', (e) => {
    joyActive = true;
    const touch = e.touches[0];
    const rect = joyZone.getBoundingClientRect();
    joyStart = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    updateJoystick(touch);
}, { passive: false });

window.addEventListener('touchmove', (e) => {
    if (!joyActive) return;
    for (let touch of e.touches) {
        if (touch.target === joyZone || joyActive) {
            updateJoystick(touch);
            break;
        }
    }
}, { passive: false });

window.addEventListener('touchend', () => {
    joyActive = false;
    input.x = 0;
    input.y = 0;
    joyKnob.style.transform = `translate(0px, 0px)`;
});

function updateJoystick(touch) {
    let dx = touch.clientX - joyStart.x;
    let dy = touch.clientY - joyStart.y;
    let dist = Math.hypot(dx, dy);

    if (dist > joyMaxRadius) {
        dx = (dx / dist) * joyMaxRadius;
        dy = (dy / dist) * joyMaxRadius;
    }

    joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    input.x = dx / joyMaxRadius;
    input.y = dy / joyMaxRadius;
}

// 버튼 입력
function bindBtn(id, key) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); input[key] = true; });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); input[key] = false; });
}
bindBtn('btn-atk', 'atk');
bindBtn('btn-skill', 'skill');
bindBtn('btn-jump', 'jump');

// --- 게임 객체 정의 ---
const GROUND_Y = canvas.height * 0.7;

class Entity {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.z = 0; // 높이 (2.5D 점프용)
        this.vz = 0;
        this.width = 32;
        this.height = 48;
        this.color = color;
        this.facing = 1; // 1: 우, -1: 좌
        this.hp = 100;
        this.maxHp = 100;
        this.isGrounded = true;
    }

    drawShadow() {
        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.beginPath();
        let scale = Math.max(0.2, 1 - this.z / 150);
        ctx.ellipse(this.x, this.y, (this.width / 2) * scale, 8 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class Player extends Entity {
    constructor(x, y) {
        super(x, y, '#111');
        this.speed = 3.5;
        this.state = 'idle'; // idle, move, attack, skill
        this.animTimer = 0;
        this.combo = 0;
        this.atkTimer = 0;
        this.weaponAngle = 0;
    }

    update() {
        // 이동 (2D 평면 움직임)
        if (this.state !== 'attack' && this.state !== 'skill') {
            this.x += input.x * this.speed;
            this.y += input.y * this.speed * 0.6; // Y축은 깊이감을 위해 살짝 둔하게
            
            // 화면 제한
            this.x = Math.max(30, Math.min(canvas.width - 30, this.x));
            this.y = Math.max(canvas.height * 0.4, Math.min(canvas.height - 40, this.y));

            if (input.x !== 0) this.facing = input.x > 0 ? 1 : -1;
        }

        // 점프
        if (input.jump && this.isGrounded) {
            this.vz = 10;
            this.isGrounded = false;
        }

        // 중력 처리 (Z축)
        if (!this.isGrounded) {
            this.z += this.vz;
            this.vz -= 0.6;
            if (this.z <= 0) {
                this.z = 0;
                this.vz = 0;
                this.isGrounded = true;
            }
        }

        // 일반 공격
        if (input.atk && this.atkTimer === 0) {
            this.state = 'attack';
            this.atkTimer = 15;
            this.weaponAngle = -Math.PI / 2;
            createHitbox(this.x + this.facing * 40, this.y, this.z, 50, 10);
            input.atk = false; // 단발 입력
        }

        // 필살기 (2.5D 스핀 어택)
        if (input.skill && this.atkTimer === 0) {
            this.state = 'skill';
            this.atkTimer = 30;
            createHitbox(this.x, this.y, this.z, 90, 25, true);
            input.skill = false;
        }

        // 타이머 및 상태 업데이트
        if (this.atkTimer > 0) {
            this.atkTimer--;
            if (this.state === 'attack') {
                this.weaponAngle += (Math.PI / 10) * this.facing;
            } else if (this.state === 'skill') {
                this.weaponAngle += Math.PI / 3;
            }
            if (this.atkTimer === 0) this.state = 'idle';
        }

        this.animTimer++;
    }

    draw() {
        this.drawShadow();

        const renderY = this.y - this.z;

        ctx.save();
        ctx.translate(this.x, renderY);

        // --- 캐릭터 픽셀 아트 본체 (검은 윤곽선 강조) ---
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#000000';
        ctx.fillStyle = '#ffffff';

        // 머리
        ctx.fillRect(-10, -42, 20, 20);
        ctx.strokeRect(-10, -42, 20, 20);

        // 눈 (도트)
        ctx.fillStyle = '#000';
        let eyeOffset = this.facing === 1 ? 2 : -6;
        ctx.fillRect(eyeOffset, -36, 4, 4);

        // 몸통
        ctx.fillStyle = '#111111';
        let bob = Math.sin(this.animTimer * 0.2) * (input.x || input.y ? 3 : 1);
        ctx.fillRect(-8, -22 + bob, 16, 22);
        ctx.strokeRect(-8, -22 + bob, 16, 22);

        // 다리
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-7, 0, 5, 8);
        ctx.strokeRect(-7, 0, 5, 8);
        ctx.fillRect(2, 0, 5, 8);
        ctx.strokeRect(2, 0, 5, 8);

        // --- 2.5D 입체 무기 (검) 렌더링 ---
        ctx.save();
        ctx.translate(0, -15); // 손 위치
        if (this.state === 'attack' || this.state === 'skill') {
            ctx.rotate(this.weaponAngle);
        } else {
            ctx.rotate((this.facing * Math.PI) / 6);
        }

        // 검 자루 및 날
        ctx.fillStyle = '#000';
        ctx.fillRect(0, -4, 4, 8); // 자루
        ctx.fillStyle = '#fff';
        ctx.fillRect(4, -3, 28, 6); // 칼날
        ctx.strokeRect(4, -3, 28, 6);

        // 2.5D 검 궤적 잔상 (Attack / Skill 시)
        if (this.state === 'attack' || this.state === 'skill') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.beginPath();
            ctx.arc(0, 0, 35, -Math.PI / 4, Math.PI / 4);
            ctx.fill();
        }
        ctx.restore();

        ctx.restore();
    }
}

class Dummy extends Entity {
    constructor(x, y) {
        super(x, y, '#555');
        this.hitTimer = 0;
        this.vx = 0;
        this.vy = 0;
    }

    update() {
        // 복귀 및 감쇄
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.8;
        this.vy *= 0.8;

        // 경계
        this.x = Math.max(50, Math.min(canvas.width - 50, this.x));
        this.y = Math.max(canvas.height * 0.4, Math.min(canvas.height - 40, this.y));

        if (this.hitTimer > 0) this.hitTimer--;

        // 체력 리젠 (연습용 더미)
        if (this.hp < this.maxHp && this.hitTimer === 0) {
            this.hp += 0.2;
        }

        // UI 업데이트
        document.getElementById('dummy-hp').style.width = `${(this.hp / this.maxHp) * 100}%`;
    }

    draw() {
        this.drawShadow();

        ctx.save();
        ctx.translate(this.x, this.y);

        // 피격 시 붉은 셰이더 및 흔들림
        let shake = this.hitTimer > 0 ? (Math.random() - 0.5) * 6 : 0;
        ctx.translate(shake, 0);

        ctx.lineWidth = 3;
        ctx.strokeStyle = '#000000';
        ctx.fillStyle = this.hitTimer > 0 ? '#ff4444' : '#eeeeee';

        // 샌드백 타입 더미 몸통 (도트 스타일)
        ctx.fillRect(-12, -45, 24, 45);
        ctx.strokeRect(-12, -45, 24, 45);

        // 더미 무늬 (X 표시)
        ctx.beginPath();
        ctx.moveTo(-6, -35); ctx.lineTo(6, -25);
        ctx.moveTo(6, -35); ctx.lineTo(-6, -25);
        ctx.stroke();

        // 받침대
        ctx.fillStyle = '#111';
        ctx.fillRect(-16, -3, 32, 6);

        ctx.restore();
    }
}

// --- 이펙트 및 히트박스 시스템 ---
const particles = [];
const hitboxes = [];

function createHitbox(x, y, z, range, damage, isSpin = false) {
    hitboxes.push({ x, y, z, range, damage, life: 3 });

    // 2.5D 타격 파티클 생성
    for (let i = 0; i < (isSpin ? 16 : 8); i++) {
        let angle = isSpin ? (Math.PI * 2 * i) / 16 : Math.atan2(y, x) + (Math.random() - 0.5);
        particles.push({
            x: x,
            y: y - z,
            vx: Math.cos(angle) * (Math.random() * 6 + 2),
            vy: Math.sin(angle) * (Math.random() * 6 + 2),
            size: Math.random() * 6 + 3,
            life: 15
        });
    }
}

function updateEffects() {
    // 히트박스 연산
    for (let i = hitboxes.length - 1; i >= 0; i--) {
        let hb = hitboxes[i];
        
        // 더미와의 거리 계산 (2.5D Y축 깊이 반영)
        let dx = dummy.x - hb.x;
        let dy = (dummy.y - hb.y) * 2; // Y축 가중치로 입체감 형성
        let dist = Math.hypot(dx, dy);

        if (dist < hb.range && Math.abs(dummy.z - hb.z) < 30) {
            dummy.hp = Math.max(0, dummy.hp - hb.damage);
            dummy.hitTimer = 10;
            dummy.vx = player.facing * 8; // 넉백
            dummy.vy = (Math.random() - 0.5) * 3;
            hitboxes.splice(i, 1);
            continue;
        }

        hb.life--;
        if (hb.life <= 0) hitboxes.splice(i, 1);
    }

    // 파티클 업데이트
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawEffects() {
    // 파티클 렌더링
    particles.forEach(p => {
        ctx.fillStyle = '#000000';
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });
}

// --- 단순화된 배경 그리드/기준선 ---
function drawSimpleBackground() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 단순한 지면 구분선 (2.5D 스테이지 깊이감 수평선)
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 2;

    let startY = canvas.height * 0.4;
    let endY = canvas.height - 40;

    // 수평선 3줄만 배치하여 극한의 단순함 연출
    ctx.beginPath();
    ctx.moveTo(0, startY); ctx.lineTo(canvas.width, startY);
    ctx.moveTo(0, endY); ctx.lineTo(canvas.width, endY);
    ctx.stroke();

    // 점선 스타일의 Y축 격자선
    ctx.setLineDash([5, 15]);
    ctx.beginPath();
    ctx.moveTo(0, (startY + endY) / 2);
    ctx.lineTo(canvas.width, (startY + endY) / 2);
    ctx.stroke();
    ctx.setLineDash([]);
}

// --- 메인 루프 ---
const player = new Player(canvas.width * 0.3, canvas.height * 0.6);
const dummy = new Dummy(canvas.width * 0.7, canvas.height * 0.6);

function gameLoop() {
    // 1. 업데이트
    player.update();
    dummy.update();
    updateEffects();

    // 2. 렌더링
    drawSimpleBackground();

    // 2.5D Y-sorting (Y 좌표 기준 렌더링 순서 정렬)
    const renderList = [player, dummy];
    renderList.sort((a, b) => a.y - b.y);

    renderList.forEach(obj => obj.draw());
    drawEffects();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
