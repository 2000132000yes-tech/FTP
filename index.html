<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>산업 엔지니어: 회로 & 경제 타이쿤</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-sub: #475569;
            --accent-blue: #2563eb;
            --accent-green: #059669;
            --accent-red: #dc2626;
            --wire-on: #eab308;
            --wire-off: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 330px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        }

        #main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #top-bar {
            height: 60px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 0.95rem;
        }

        .stat-group { display: flex; gap: 20px; align-items: center; }
        .stat-item { font-weight: 600; display: flex; gap: 6px; align-items: center; }
        .stat-val { color: var(--accent-blue); font-weight: 700; }

        #canvas-container {
            flex: 1;
            position: relative;
            background: #e2e8f0;
            overflow: hidden;
        }

        canvas { display: block; cursor: crosshair; }

        .panel-section {
            padding: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .build-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .build-btn {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 10px 8px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s ease;
        }

        .build-btn:hover {
            border-color: var(--accent-blue);
            background: #eff6ff;
        }

        .build-btn.active {
            background: #dbeafe;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(37,99,235,0.2);
        }

        .build-title { font-weight: 700; font-size: 0.85rem; display: block; color: var(--text-main); }
        .build-cost { font-size: 0.75rem; color: var(--text-sub); margin-top: 2px; display: block; }

        .market-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .market-table th, .market-table td {
            padding: 6px 4px;
            text-align: left;
            border-bottom: 1px solid #f1f5f9;
        }

        .trend-up { color: var(--accent-red); font-weight: 700; }
        .trend-down { color: var(--accent-blue); font-weight: 700; }

        #info-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            width: 280px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: none;
        }

        .btn-action {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            color: white;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        .btn-action:hover { opacity: 0.9; }

        /* 그래프 오버레이 하단 창 */
        #chart-container {
            height: 120px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 8px 15px;
            position: relative;
        }
        #chartCanvas { width: 100%; height: 80px; display: block; }
    </style>
</head>
<body>

    <!-- 왼쪽 설정/건설 메뉴 -->
    <div id="sidebar">
        <div class="panel-section">
            <div class="panel-title">건설 및 자동화 도구</div>
            <div class="build-grid">
                <button class="build-btn active" onclick="setMode('select', this)">
                    <span class="build-title">👆 선택 및 정보</span>
                    <span class="build-cost">설비 클릭 관리</span>
                </button>
                <button class="build-btn" onclick="setMode('belt', this)">
                    <span class="build-title">🛤️ 컨베이어 벨트</span>
                    <span class="build-cost">$10 / 설치</span>
                </button>
                <button class="build-btn" onclick="setMode('wire', this)">
                    <span class="build-title">⚡ 회로 신호선</span>
                    <span class="build-cost">$5 / 연결</span>
                </button>
                <button class="build-btn" onclick="setMode('miner', this)">
                    <span class="build-title">⛏️ 자원 채굴기</span>
                    <span class="build-cost">$120</span>
                </button>
                <button class="build-btn" onclick="setMode('processor', this)">
                    <span class="build-title">⚙️ 가공 공장</span>
                    <span class="build-cost">$250</span>
                </button>
                <button class="build-btn" onclick="setMode('clock', this)">
                    <span class="build-title">⏱️ 회로 타이머</span>
                    <span class="build-cost">$80</span>
                </button>
                <button class="build-btn" onclick="setMode('seller', this)">
                    <span class="build-title">📦 자동 출하 창고</span>
                    <span class="build-cost">$180</span>
                </button>
            </div>
        </div>

        <div class="panel-section" style="flex:1; overflow-y:auto;">
            <div class="panel-title">실시간 자원 시장 시세</div>
            <table class="market-table">
                <thead>
                    <tr>
                        <th>품목</th>
                        <th>현재가</th>
                        <th>변동</th>
                        <th>시업 재고</th>
                    </tr>
                </thead>
                <tbody id="market-body"></tbody>
            </table>
        </div>

        <div class="panel-section">
            <button class="btn-action" style="background: var(--accent-green);" onclick="sellAll()">모든 설비 재고 수동 판매</button>
        </div>
    </div>

    <!-- 메인 타이쿤 게임 영역 -->
    <div id="main-area">
        <div id="top-bar">
            <div class="stat-group">
                <div class="stat-item">
                    <span>자금:</span>
                    <span class="stat-val" id="money-txt">$1,000</span>
                </div>
                <div class="stat-item">
                    <span>유지비:</span>
                    <span style="color: var(--accent-red);" id="upkeep-txt">-$0/초</span>
                </div>
            </div>
            <div class="stat-group">
                <div class="stat-item">
                    <span>최근 손익(Net Profit):</span>
                    <span id="profit-txt" style="font-weight:700;">$0</span>
                </div>
                <div class="stat-item">
                    <span>시세 변동:</span>
                    <span id="timer-txt" style="color: var(--accent-blue);">10초</span>
                </div>
            </div>
        </div>

        <!-- 캔버스 실시간 실행 화면 -->
        <div id="canvas-container">
            <canvas id="factoryCanvas"></canvas>

            <div id="info-panel">
                <h4 id="info-title" style="margin-bottom: 6px;">설비 정보</h4>
                <div id="info-body" style="font-size:0.85rem; color: var(--text-sub);"></div>
                <button class="btn-action" style="background: var(--accent-red);" onclick="deleteSelected()">건물 철거 및 철회</button>
            </div>
        </div>

        <!-- 하단 실시간 수익/손익 실시간 차트 -->
        <div id="chart-container">
            <div class="panel-title" style="margin-bottom: 4px;">실시간 순이익 흐름 차트 (0 위: 흑자 / 0 아래: 적자)</div>
            <canvas id="chartCanvas"></canvas>
        </div>
    </div>

    <script>
        const GRID = 40;
        let money = 1000;
        let currentMode = 'select';
        let selected = null;
        let wireStart = null;

        // 경제 시스템 데이터
        const market = {
            ore: { name: "철광석", price: 20, base: 20, trend: 0, stock: 0 },
            ingot: { name: "가공 철판", price: 55, base: 55, trend: 0, stock: 0 },
            circuit: { name: "전자 회로", price: 150, base: 150, trend: 0, stock: 0 }
        };

        const entities = [];
        const wires = [];
        const items = []; // 벨트 위 애니메이션 아이템
        const profitHistory = new Array(50).fill(0); // 차트용 손익 히스토리

        let totalIncome = 0;
        let totalExpense = 0;

        const canvas = document.getElementById('factoryCanvas');
        const ctx = canvas.getContext('2d');
        const chartCanvas = document.getElementById('chartCanvas');
        const chartCtx = chartCanvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            chartCanvas.width = chartCanvas.clientWidth;
            chartCanvas.height = chartCanvas.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 엔티티 구조
        class Entity {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.signal = false;
                this.timer = 0;
                this.dir = 'RIGHT'; // 컨베이어 방향
            }

            update() {
                // 유지비 발생
                if (this.type === 'miner') totalExpense += 0.05;
                if (this.type === 'processor') totalExpense += 0.1;

                if (this.type === 'clock') {
                    this.timer += 0.02;
                    if (this.timer >= 2) {
                        this.signal = !this.signal;
                        this.timer = 0;
                    }
                }

                if (this.type === 'miner') {
                    if (this.signal || !this.hasWire()) {
                        this.timer += 0.02;
                        if (this.timer >= 2.5) {
                            items.push(new MovingItem(this.x, this.y, 'ore'));
                            this.timer = 0;
                        }
                    }
                }

                if (this.type === 'seller') {
                    items.forEach((it, idx) => {
                        if (Math.floor(it.x) === this.x && Math.floor(it.y) === this.y) {
                            const val = market[it.type].price;
                            money += val;
                            totalIncome += val;
                            market[it.type].stock += 1;
                            items.splice(idx, 1);
                        }
                    });
                }
            }

            hasWire() {
                return wires.some(w => w.to === this);
            }

            draw() {
                const px = this.x * GRID;
                const py = this.y * GRID;

                ctx.fillStyle = this.getColor();
                ctx.fillRect(px+2, py+2, GRID-4, GRID-4);
                ctx.strokeStyle = (selected === this) ? '#2563eb' : '#cbd5e1';
                ctx.lineWidth = (selected === this) ? 3 : 1;
                ctx.strokeRect(px+2, py+2, GRID-4, GRID-4);

                ctx.fillStyle = '#0f172a';
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                let icon = '';
                if (this.type === 'miner') icon = '⛏️';
                if (this.type === 'processor') icon = '⚙️';
                if (this.type === 'clock') icon = '⏱️';
                if (this.type === 'seller') icon = '📦';
                if (this.type === 'belt') icon = '➔';

                ctx.fillText(icon, px + GRID/2, py + GRID/2);

                if (this.type === 'clock' || this.hasWire()) {
                    ctx.fillStyle = this.signal ? '#059669' : '#dc2626';
                    ctx.beginPath();
                    ctx.arc(px + GRID - 6, py + 6, 4, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            getColor() {
                switch(this.type) {
                    case 'miner': return '#f1f5f9';
                    case 'processor': return '#ffedd5';
                    case 'clock': return '#fef9c3';
                    case 'seller': return '#dcfce7';
                    case 'belt': return '#e2e8f0';
                    default: return '#ffffff';
                }
            }
        }

        // 레일 위 이동 아이템 애니메이션
        class MovingItem {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.speed = 0.03;
            }

            update() {
                const curX = Math.floor(this.x);
                const curY = Math.floor(this.y);
                const tile = entities.find(e => e.x === curX && e.y === curY);

                // 가공 공장 입착 시 변환
                if (tile && tile.type === 'processor') {
                    if (tile.signal || !tile.hasWire()) {
                        if (this.type === 'ore') {
                            this.type = 'ingot';
                        }
                    }
                }

                // 이동 처리
                this.x += this.speed;
            }

            draw() {
                const px = this.x * GRID + GRID/2;
                const py = this.y * GRID + GRID/2;

                ctx.beginPath();
                ctx.arc(px, py, 6, 0, Math.PI*2);
                if (this.type === 'ore') ctx.fillStyle = '#78716c';
                else if (this.type === 'ingot') ctx.fillStyle = '#38bdf8';
                else ctx.fillStyle = '#a855f7';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        // 모드 전환
        function setMode(mode, btn) {
            currentMode = mode;
            wireStart = null;
            document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // 캔버스 클릭 처리
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const gx = Math.floor((e.clientX - rect.left) / GRID);
            const gy = Math.floor((e.clientY - rect.top) / GRID);

            const clicked = entities.find(ent => ent.x === gx && ent.y === gy);

            if (currentMode === 'select') {
                selected = clicked || null;
                updatePanel();
            } else if (currentMode === 'wire') {
                if (clicked) {
                    if (!wireStart) {
                        wireStart = clicked;
                    } else if (wireStart !== clicked) {
                        if (money >= 5) {
                            money -= 5;
                            wires.push({ from: wireStart, to: clicked });
                            wireStart = null;
                        }
                    }
                }
            } else {
                if (!clicked) {
                    const costs = { miner: 120, processor: 250, clock: 80, seller: 180, belt: 10 };
                    const cost = costs[currentMode];
                    if (money >= cost) {
                        money -= cost;
                        entities.push(new Entity(gx, gy, currentMode));
                    }
                }
            }
        });

        function deleteSelected() {
            if (!selected) return;
            const idx = entities.indexOf(selected);
            if (idx > -1) {
                for (let i = wires.length - 1; i >= 0; i--) {
                    if (wires[i].from === selected || wires[i].to === selected) wires.splice(i, 1);
                }
                entities.splice(idx, 1);
                selected = null;
                updatePanel();
            }
        }

        function updatePanel() {
            const panel = document.getElementById('info-panel');
            if (!selected) { panel.style.display = 'none'; return; }
            panel.style.display = 'block';
            document.getElementById('info-title').innerText = selected.type.toUpperCase() + ' 설비 정보';
            document.getElementById('info-body').innerHTML = `
                위치 좌표: (${selected.x}, ${selected.y})<br>
                회로 신호 상태: <b>${selected.signal ? 'HIGH (ON)' : 'LOW (OFF)'}</b>
            `;
        }

        // 시장 경제 갱신
        let marketTimer = 10;
        setInterval(() => {
            marketTimer--;
            if (marketTimer <= 0) {
                marketTimer = 10;
                for (let k in market) {
                    const item = market[k];
                    const supply = (10 - item.stock) * 0.05;
                    const rand = (Math.random() - 0.48) * 0.15;
                    item.price = Math.max(5, Math.round(item.base * (1 + supply + rand)));
                    item.trend = item.price - item.base;
                    item.stock = Math.max(0, item.stock - 3);
                }
                renderMarket();
            }
            document.getElementById('timer-txt').innerText = marketTimer + '초';
        }, 1000);

        function renderMarket() {
            const tbody = document.getElementById('market-body');
            tbody.innerHTML = '';
            for (let k in market) {
                const item = market[k];
                const tr = document.createElement('tr');
                const tClass = item.trend >= 0 ? 'trend-up' : 'trend-down';
                const tSign = item.trend >= 0 ? '▲' : '▼';
                tr.innerHTML = `
                    <td>${item.name}</td>
                    <td>$${item.price}</td>
                    <td class="${tClass}">${tSign} ${Math.abs(item.trend)}</td>
                    <td>${item.stock}</td>
                `;
                tbody.appendChild(tr);
            }
        }

        function sellAll() {
            items.forEach((it, idx) => {
                money += market[it.type].price;
            });
            items.length = 0;
        }

        // 손익 차트 렌더링
        setInterval(() => {
            const netProfit = totalIncome - totalExpense;
            profitHistory.push(netProfit);
            profitHistory.shift();

            totalIncome = 0;
            totalExpense = 0;

            document.getElementById('profit-txt').innerText = (netProfit >= 0 ? '+$' : '-$') + Math.abs(Math.round(netProfit));
            document.getElementById('profit-txt').style.color = netProfit >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
            
            drawChart();
        }, 1000);

        function drawChart() {
            const w = chartCanvas.width;
            const h = chartCanvas.height;
            chartCtx.clearRect(0, 0, w, h);

            // 0 기준선
            const zeroY = h / 2;
            chartCtx.strokeStyle = '#94a3b8';
            chartCtx.lineWidth = 1;
            chartCtx.beginPath();
            chartCtx.moveTo(0, zeroY);
            chartCtx.lineTo(w, zeroY);
            chartCtx.stroke();

            // 그래프 그리기
            chartCtx.beginPath();
            const step = w / (profitHistory.length - 1);
            
            profitHistory.forEach((val, idx) => {
                const x = idx * step;
                const y = zeroY - (val * 1.5); // 스케일 조정
                if (idx === 0) chartCtx.moveTo(x, y);
                else chartCtx.lineTo(x, y);
            });

            chartCtx.strokeStyle = '#2563eb';
            chartCtx.lineWidth = 2;
            chartCtx.stroke();
        }

        // 메인 게임 루프
        function loop() {
            wires.forEach(w => w.to.signal = w.from.signal);
            entities.forEach(e => e.update());
            items.forEach(it => it.update());

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 0.5;
            for (let x = 0; x < canvas.width; x += GRID) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += GRID) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Wires
            wires.forEach(w => {
                ctx.strokeStyle = w.from.signal ? 'var(--wire-on)' : 'var(--wire-off)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(w.from.x * GRID + GRID/2, w.from.y * GRID + GRID/2);
                ctx.lineTo(w.to.x * GRID + GRID/2, w.to.y * GRID + GRID/2);
                ctx.stroke();
            });

            // Entities & Items
            entities.forEach(e => e.draw());
            items.forEach(it => it.draw());

            document.getElementById('money-txt').innerText = '$' + Math.floor(money).toLocaleString();

            requestAnimationFrame(loop);
        }

        renderMarket();
        loop();
    </script>
</body>
</html>
