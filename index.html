<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pixel Earth Game</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050b14;
      font-family: 'Courier New', Courier, monospace;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    /* 하단 UI 창 */
    #bottom-ui {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 420px;
      height: 64px;
      background: rgba(18, 22, 36, 0.92);
      border: 2px solid #3b486b;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      z-index: 10;
    }
    .stats-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .coin-icon {
      width: 22px;
      height: 22px;
      background-color: #ffd700;
      border: 2px solid #b8860b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 11px;
      color: #5c3a00;
    }
    .money-details {
      display: flex;
      flex-direction: column;
    }
    .money-text {
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    .income-text {
      color: #4ade80;
      font-size: 10px;
      margin-top: 1px;
    }
    .build-btn {
      background: #2563eb;
      border: 2px solid #60a5fa;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .build-btn.active {
      background: #16a34a;
      border-color: #86efac;
    }
    .build-btn:disabled {
      background: #475569;
      border-color: #64748b;
      opacity: 0.6;
      cursor: not-allowed;
    }
    .house-icon {
      width: 12px;
      height: 12px;
      background: #4ade80;
      clip-path: polygon(50% 0%, 100% 40%, 100% 100%, 0% 100%, 0% 40%);
    }
    #synergy-banner {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      border: 1px solid #4ade80;
      color: #4ade80;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      pointer-events: none;
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>
    <div id="synergy-banner">시너지 발동 중!</div>
    <div id="bottom-ui">
      <div class="stats-container">
        <div class="coin-icon">C</div>
        <div class="money-details">
          <div id="money-display" class="money-text">100</div>
          <div id="income-display" class="income-text">+1/초</div>
        </div>
      </div>
      <button id="build-btn" class="build-btn">
        <div class="house-icon"></div>
        <span id="build-btn-text">집 건설 (50원)</span>
      </button>
    </div>
  </div>

  <script>
    const MAP_SIZE = 120;
    const WATER_DEEP = 0, WATER_SHALLOW = 1, LAND = 2, STONE = 3;
    const NATION_NONE = 0, NATION_PLAYER = 1, NATION_SMALL = 2, NATION_LARGE = 3;

    let map = [];
    let nations = [];
    let houses = [];
    
    let money = 100;
    let houseBuyCount = 0;
    let isBuildMode = false;
    let selectedHouse = null;

    let scale = 1;
    let minScale = 1;
    let maxScale = 12;
    let offsetX = 0;
    let offsetY = 0;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const moneyDisplay = document.getElementById('money-display');
    const incomeDisplay = document.getElementById('income-display');
    const buildBtn = document.getElementById('build-btn');
    const buildBtnText = document.getElementById('build-btn-text');
    const synergyBanner = document.getElementById('synergy-banner');

    class FastNoise {
      constructor() {
        this.p = new Uint8Array(512);
        for (let i = 0; i < 256; i++) this.p[i] = this.p[256 + i] = Math.floor(Math.random() * 256);
      }
      noise(x, y) {
        let X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
        x -= Math.floor(x); y -= Math.floor(y);
        let u = x * x * x * (x * (x * 6 - 15) + 10);
        let v = y * y * y * (y * (y * 6 - 15) + 10);
        let A = this.p[X] + Y, B = this.p[X + 1] + Y;
        return this.lerp(v, this.lerp(u, this.grad(this.p[A], x, y), this.grad(this.p[B], x - 1, y)),
                           this.lerp(u, this.grad(this.p[A + 1], x, y - 1), this.grad(this.p[B + 1], x - 1, y - 1)));
      }
      lerp(t, a, b) { return a + t * (b - a); }
      grad(hash, x, y) {
        let h = hash & 7;
        let u = h < 4 ? x : y;
        let v = h < 4 ? y : x;
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
      }
    }

    const noiseGen = new FastNoise();

    function getHousePrice() {
      if (houseBuyCount < 4) return 50;
      return 50 * Math.pow(2, houseBuyCount - 3);
    }

    function formatMoney(num) {
      if (num >= 10000) return (num / 1000).toFixed(0) + 'K';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return Math.floor(num).toString();
    }

    function initMap() {
      map = Array.from({ length: MAP_SIZE }, () => Array(MAP_SIZE).fill(WATER_DEEP));
      nations = Array.from({ length: MAP_SIZE }, () => Array(MAP_SIZE).fill(NATION_NONE));

      for (let r = 0; r < MAP_SIZE; r++) {
        for (let c = 0; c < MAP_SIZE; c++) {
          let nx = c / 18, ny = r / 18;
          let val = noiseGen.noise(nx, ny) + noiseGen.noise(nx * 2, ny * 2) * 0.5;
          if (val > 0.15) map[r][c] = LAND;
          else if (val > 0.05) map[r][c] = WATER_SHALLOW;
        }
      }

      let stoneCenters = [];
      for (let i = 0; i < 6; i++) {
        let cr = Math.floor(Math.random() * MAP_SIZE);
        let cc = Math.floor(Math.random() * MAP_SIZE);
        if (map[cr][cc] === LAND) stoneCenters.push({ r: cr, c: cc, radius: 2 + Math.random() * 2 });
      }
      stoneCenters.forEach(sc => {
        for (let r = 0; r < MAP_SIZE; r++) {
          for (let c = 0; c < MAP_SIZE; c++) {
            let dist = Math.hypot(r - sc.r, c - sc.c);
            if (dist <= sc.radius && map[r][c] === LAND) {
              map[r][c] = STONE;
            }
          }
        }
      });

      let placed = false;
      for (let attempts = 0; attempts < 500 && !placed; attempts++) {
        let pr = Math.floor(Math.random() * (MAP_SIZE - 6)) + 3;
        let pc = Math.floor(Math.random() * (MAP_SIZE - 6)) + 3;
        
        let valid = true;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (map[pr + dr][pc + dc] !== LAND) valid = false;
          }
        }
        if (valid) {
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              nations[pr + dr][pc + dc] = NATION_PLAYER;
            }
          }
          placed = true;
        }
      }

      placeNations(NATION_SMALL, 4, 2);
      placeNations(NATION_LARGE, 2, 5);
    }

    function placeNations(type, count, radius) {
      for (let i = 0; i < count; i++) {
        let nr = Math.floor(Math.random() * MAP_SIZE);
        let nc = Math.floor(Math.random() * MAP_SIZE);
        for (let r = 0; r < MAP_SIZE; r++) {
          for (let c = 0; c < MAP_SIZE; c++) {
            if (Math.hypot(r - nr, c - nc) <= radius && map[r][c] === LAND && nations[r][c] === NATION_NONE) {
              nations[r][c] = type;
            }
          }
        }
      }
    }

    function calculateIncome() {
      let total = 1;
      let maxSynergyMultiplier = 1;

      houses.forEach(h => {
        let nearbyCount = 0;
        houses.forEach(other => {
          let dist = Math.hypot(h.r - other.r, h.c - other.c);
          if (dist <= 3) nearbyCount++;
        });

        let baseHouseIncome = 5;
        let bonusIncome = (nearbyCount - 1);
        
        let mult = 1;
        if (nearbyCount >= 20) mult = 4;
        else if (nearbyCount >= 10) mult = 3;
        else if (nearbyCount >= 5) mult = 2;

        if (mult > maxSynergyMultiplier) maxSynergyMultiplier = mult;

        total += (baseHouseIncome + bonusIncome) * mult;
      });

      if (maxSynergyMultiplier > 1) {
        synergyBanner.style.display = 'block';
        synergyBanner.innerText = `집 시너지 발동! (${maxSynergyMultiplier}배 보너스)`;
      } else {
        synergyBanner.style.display = 'none';
      }

      return total;
    }

    function gameLoop() {
      let income = calculateIncome();
      money += income;
      updateUI();
    }

    function updateUI() {
      moneyDisplay.innerText = formatMoney(money);
      incomeDisplay.innerText = `+${formatMoney(calculateIncome())}/초`;

      let price = getHousePrice();
      buildBtnText.innerText = `집 건설 (${formatMoney(price)}원)`;
      buildBtn.disabled = money < price;
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let scaleX = canvas.width / MAP_SIZE;
      let scaleY = canvas.height / MAP_SIZE;
      minScale = Math.min(scaleX, scaleY);

      if (scale < minScale) scale = minScale;
      clampOffset();
      draw();
    }

    function clampOffset() {
      let mapW = MAP_SIZE * scale;
      let mapH = MAP_SIZE * scale;

      if (mapW <= canvas.width) {
        offsetX = (canvas.width - mapW) / 2;
      } else {
        offsetX = Math.min(0, Math.max(canvas.width - mapW, offsetX));
      }

      if (mapH <= canvas.height) {
        offsetY = (canvas.height - mapH) / 2;
      } else {
        offsetY = Math.min(0, Math.max(canvas.height - mapH, offsetY));
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < MAP_SIZE; r++) {
        for (let c = 0; c < MAP_SIZE; c++) {
          let x = offsetX + c * scale;
          let y = offsetY + r * scale;

          if (x + scale < 0 || x > canvas.width || y + scale < 0 || y > canvas.height) continue;

          let tile = map[r][c];
          if (tile === WATER_DEEP) ctx.fillStyle = '#1e3a8a';
          else if (tile === WATER_SHALLOW) ctx.fillStyle = '#3b82f6';
          else if (tile === LAND) ctx.fillStyle = '#22c55e';
          else if (tile === STONE) ctx.fillStyle = '#64748b';

          let nation = nations[r][c];
          if (nation === NATION_PLAYER) ctx.fillStyle = '#ec4899';
          else if (nation === NATION_SMALL) ctx.fillStyle = '#a3e635';
          else if (nation === NATION_LARGE) ctx.fillStyle = '#a855f7';

          ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(scale), Math.ceil(scale));

          if (scale > 4) {
            ctx.strokeStyle = 'rgba(0,0,0,0.08)';
            ctx.lineWidth = 0.5;
            ctx.strokeRect(Math.floor(x), Math.floor(y), Math.ceil(scale), Math.ceil(scale));
          }
        }
      }

      houses.forEach(h => {
        let x = offsetX + h.c * scale;
        let y = offsetY + h.r * scale;
        ctx.fillStyle = '#15803d';
        ctx.fillRect(Math.floor(x + scale * 0.1), Math.floor(y + scale * 0.1), scale * 0.8, scale * 0.8);
      });

      if (selectedHouse) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        for (let r = 0; r < MAP_SIZE; r++) {
          for (let c = 0; c < MAP_SIZE; c++) {
            if (Math.hypot(r - selectedHouse.r, c - selectedHouse.c) <= 3) {
              let x = offsetX + c * scale;
              let y = offsetY + r * scale;
              ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(scale), Math.ceil(scale));
            }
          }
        }
      }
    }

    let isDragging = false;
    let startX = 0, startY = 0;

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - offsetX;
      startY = e.clientY - offsetY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      offsetX = e.clientX - startX;
      offsetY = e.clientY - startY;
      clampOffset();
      draw();
    });

    window.addEventListener('mouseup', () => isDragging = false);

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      let zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      let newScale = Math.min(maxScale, Math.max(minScale, scale * zoomFactor));

      let mouseX = e.clientX;
      let mouseY = e.clientY;

      offsetX = mouseX - (mouseX - offsetX) * (newScale / scale);
      offsetY = mouseY - (mouseY - offsetY) * (newScale / scale);
      scale = newScale;

      clampOffset();
      draw();
    }, { passive: false });

    let initialPinchDist = null;
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - offsetX;
        startY = e.touches[0].clientY - offsetY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging) {
        offsetX = e.touches[0].clientX - startX;
        offsetY = e.touches[0].clientY - startY;
        clampOffset();
        draw();
      } else if (e.touches.length === 2 && initialPinchDist) {
        let currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        let zoomFactor = currentDist / initialPinchDist;
        initialPinchDist = currentDist;

        let centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        let centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

        let newScale = Math.min(maxScale, Math.max(minScale, scale * zoomFactor));
        offsetX = centerX - (centerX - offsetX) * (newScale / scale);
        offsetY = centerY - (centerY - offsetY) * (newScale / scale);
        scale = newScale;

        clampOffset();
        draw();
      }
    });

    canvas.addEventListener('touchend', () => {
      isDragging = false;
      initialPinchDist = null;
    });

    canvas.addEventListener('click', (e) => {
      let rect = canvas.getBoundingClientRect();
      let clickX = e.clientX - rect.left - offsetX;
      let clickY = e.clientY - rect.top - offsetY;

      let col = Math.floor(clickX / scale);
      let row = Math.floor(clickY / scale);

      if (row < 0 || row >= MAP_SIZE || col < 0 || col >= MAP_SIZE) return;

      if (isBuildMode) {
        let price = getHousePrice();
        if (nations[row][col] === NATION_PLAYER && money >= price) {
          let hasHouse = houses.some(h => h.r === row && h.c === col);
          if (!hasHouse) {
            houses.push({ r: row, c: col });
            money -= price;
            houseBuyCount++;
            isBuildMode = false;
            buildBtn.classList.remove('active');
            updateUI();
            draw();
          }
        }
      } else {
        let house = houses.find(h => h.r === row && h.c === col);
        if (house) {
          selectedHouse = (selectedHouse === house) ? null : house;
        } else {
          selectedHouse = null;
        }
        draw();
      }
    });

    buildBtn.addEventListener('click', () => {
      isBuildMode = !isBuildMode;
      if (isBuildMode) {
        buildBtn.classList.add('active');
      } else {
        buildBtn.classList.remove('active');
      }
    });

    window.addEventListener('resize', resizeCanvas);
    initMap();
    resizeCanvas();
    setInterval(gameLoop, 1000);
  </script>
</body>
</html>
