<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Graph AI Battle</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 500px;
            height: 500px;
            background-color: #1e1e1e;
            border: 3px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            width: 90%;
        }

        #intro-text {
            font-size: 18px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0,255,204,0.6);
            white-space: pre-wrap;
            border-right: 2px solid #00ffcc;
            display: inline-block;
            animation: blink-caret 0.75s step-end infinite;
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #00ffcc; }
        }

        #status-panel {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <div id="intro-text"></div>
            <div id="status-panel">상태: 시스템 초기화 중...</div>
        </div>
        <canvas id="simCanvas" width="500" height="500"></canvas>
    </div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const introTextEl = document.getElementById('intro-text');
    const statusPanel = document.getElementById('status-panel');

    // 1. 텍스트 애니메이션 설정
    const fullMessage = "[SYSTEM] AI 위치 동기화 완료.\n수학적 그래프 공격 모듈을 가동합니다.";
    let charIndex = 0;
    let isTypingDone = false;

    function typeWriter() {
        if (charIndex < fullMessage.length) {
            introTextEl.textContent += fullMessage.charAt(charIndex);
            charIndex++;
            setTimeout(typeWriter, 50);
        } else {
            isTypingDone = true;
            statusPanel.textContent = "전투 시작! AI들이 함수 그래프를 발사합니다.";
            setTimeout(() => { introTextEl.style.display = 'none'; }, 2000);
        }
    }

    // 2. 게임 오브젝트 (AI 공들) 설정
    const colors = ['#ff5252', '#ffeb3b', '#4caf50', '#2196f3', '#e040fb'];
    let ais = [];
    let bullets = [];

    class AIObject {
        constructor(id, x, y, color) {
            this.id = id;
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = (Math.random() - 0.5) * 2;
            this.radius = 12;
            this.color = color;
            this.hp = 100;
            this.isAlive = true;
            this.attackCooldown = Math.random() * 60 + 40;
        }

        update() {
            if (!this.isAlive) return;

            // 이동 (벽 충돌 반사)
            this.x += this.vx;
            this.y += this.vy;

            if (this.x < this.radius || this.x > canvas.width - this.radius) this.vx *= -1;
            if (this.y < this.radius || this.y > canvas.height - this.radius) this.vy *= -1;

            // 공격 쿨다운
            if (isTypingDone && this.attackCooldown > 0) {
                this.attackCooldown--;
            }
        }

        draw() {
            if (!this.isAlive) return;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
            ctx.stroke();
            ctx.closePath();

            // HP 바
            ctx.fillStyle = 'red';
            ctx.fillRect(this.x - 15, this.y - 20, 30, 4);
            ctx.fillStyle = 'green';
            ctx.fillRect(this.x - 15, this.y - 20, (this.hp / 100) * 30, 4);
        }

        // 모든 AI의 위치 정보를 공유받아 수학적 함수 그래프(탄환) 생성
        shootGraph(targets) {
            if (!this.isAlive || targets.length === 0) return;

            // 살아있는 타겟 중 무작위 한 명 선정 (위치 공유 시스템 활용)
            const liveTargets = targets.filter(t => t.id !== this.id && t.isAlive);
            if (liveTargets.length === 0) return;

            const target = liveTargets[Math.floor(Math.random() * liveTargets.length)];

            // 수학적 그래프 계산 (일차함수 혹은 이차함수 궤적 부여)
            // y = ax + b 또는 포물선 궤적을 그리며 서칭/발사
            bullets.push({
                startX: this.x,
                startY: this.y,
                currX: this.x,
                currY: this.y,
                targetX: target.x,
                targetY: target.y,
                color: this.color,
                progress: 0,
                speed: 0.03,
                shooterId: this.id
            });
        }
    }

    // AI 초기화 (5대)
    function initAI() {
        ais = [];
        const margin = 50;
        for (let i = 0; i < 5; i++) {
            let x = Math.random() * (canvas.width - margin * 2) + margin;
            let y = Math.random() * (canvas.height - margin * 2) + margin;
            ais.push(new AIObject(i, x, y, colors[i]));
        }
    }

    // 3. 루프 및 렌더링
    function updateGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 배경 그리드 (정사각형 판 느낌 연출)
        ctx.strokeStyle = '#2a2a2a';
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += 50) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        // AI 업데이트 및 그리기
        ais.forEach(ai => {
            ai.update();
            ai.draw();

            // 쿨다운이 끝나면 그래프 탄환 발사
            if (ai.attackCooldown <= 0 && isTypingDone) {
                ai.shootGraph(ais);
                ai.attackCooldown = Math.random() * 80 + 60; // 재장전
            }
        });

        // 그래프 탄환(서닝 발사체) 업데이트 및 렌더링
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.progress += b.speed;

            // 수학적 보간(Lerp) 및 사인파를 가미한 곡선(그래프) 궤적 계산
            let interX = b.startX + (b.targetX - b.startX) * b.progress;
            let interY = b.startY + (b.targetY - b.startY) * b.progress;
            
            // 수학 함수 그래프 효과 (예: sin 곡선 형태의 궤적 진동 추가)
            let waveOffset = Math.sin(b.progress * Math.PI * 4) * 15;
            b.currX = interX - (b.targetY - b.startY) * 0.1 * (waveOffset / 15);
            b.currY = interY + waveOffset;

            // 탄환 그리기
            ctx.beginPath();
            ctx.arc(b.currX, b.currY, 5, 0, Math.PI * 2);
            ctx.fillStyle = b.color;
            ctx.shadowColor = b.color;
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0; // 초기화
            ctx.closePath();

            // 타겟 명중 체크
            ais.forEach(ai => {
                if (ai.isAlive && ai.id !== b.shooterId) {
                    let dist = Math.hypot(ai.x - b.currX, ai.y - b.currY);
                    if (dist < ai.radius + 5) {
                        ai.hp -= 25; // 피격 데미지
                        if (ai.hp <= 0) {
                            ai.isAlive = false;
                        }
                        bullets.splice(i, 1); // 탄환 소멸
                    }
                }
            });

            // 도착 시 제거
            if (b.progress >= 1) {
                bullets.splice(i, 1);
            }
        }

        // 게임 승리 조건 확인
        let aliveAis = ais.filter(ai => ai.isAlive);
        if (isTypingDone && aliveAis.length <= 1) {
            statusPanel.textContent = aliveAis.length === 1 ? 
                `게임 종료! 승리 AI: 색상 ${aliveAis[0].color}` : .
                "게임 종료! 무승부!";
            return; // 루프 종료
        }

        requestAnimationFrame(updateGame);
    }

    // 실행 시작
    initAI();
    setTimeout(typeWriter, 500); // 0.5초 뒤 타이핑 애니메이션 시작
    requestAnimationFrame(updateGame);

</script>
</body>
</html>
