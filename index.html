<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Mobile Pixel Fighter with 2.5D Effects</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* 게임 영역 컨테이너 (정사각형 및 상단 배치) */
        #game-wrapper {
            position: relative;
            margin-top: 10px;
            border: 3px solid #000;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        /* HUD (체력바) */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-weight: bold;
            font-size: 12px;
            color: #000;
        }

        .bar-container {
            width: 100%;
            background: #eee;
            border: 2px solid #000;
            height: 14px;
            margin-top: 2px;
        }

        .bar-fill {
            height: 100%;
            background: #000;
            width: 100%;
            transition: width 0.1s linear;
        }

        .dummy-bar {
            background: #ff4444;
        }

        /* 하단 컨트롤 영역 (게임 화면 바로 아래) */
        #controls-area {
            width: 100%;
            max-width: 450px;
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-sizing: border-box;
        }

        /* 가상 조이스틱 */
        #joystick-zone {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.03);
            border: 2px dashed #999;
            position: relative;
            touch-action: none;
        }

        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            margin-top: -20px;
            margin-left: -20px;
            border-radius: 50%;
            background: #000;
        }

        /* 액션 버튼 그룹 */
        .btn-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .action-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #000;
            color: #000;
            font-weight: 900;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #000;
            touch-action: manipulation;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
            background: #000;
            color: #fff;
        }

        .btn-atk { width: 65px; height: 65px; font-size: 15px; }
    </style>
</head>
<body>

    <!-- 정사각형 게임 화면 컨테이너 -->
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>

        <div id="hud">
            <div style="width: 42%;">
                PLAYER
                <div class="bar-container"><div id="player-hp" class="bar-fill"></div></div>
            </div>
            <div style="width: 42%; text-align: right;">
                DUMMY
                <div class="bar-container"><div id="dummy-hp" class="bar-fill dummy-bar"></div></div>
            </div>
        </div>
    </div>

    <!-- 게임 화면 바로 아래에 위치하는 컨트롤 영역 -->
    <div id="controls-area">
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
        <div class="btn-group">
            <button class="action-btn" id="btn-jump">JUMP</button>
            <button class="action-btn" id="btn-skill">SKILL</button>
            <button class="action-btn btn-atk" id="btn-atk">ATK</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('game-wrapper');

// --- 정사각형 화면 크기 조절 ---
let size = 300;
function resizeGame() {
    // 화면 너비/높이에 맞춰 알맞은 정사각형 크기 결정
    size = Math.min(window.innerWidth - 20, window.innerHeight * 0.55);
    size = Math.max(280, Math.min(size, 450)); // 최소 280, 최대 450
    wrapper.style.width = size + 'px';
    wrapper.style.height = size + 'px';
    canvas.width = size;
    canvas.height = size;
}
window.addEventListener('resize', resizeGame);
resizeGame();

// --- 2D 물리 및 바닥 설정 ---
const GROUND_Y = size * 0.8;

// --- 입력 처리 ---
const input = { x: 0, atk: false, skill: false, jump: false };

const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
let joyActive = false;
let joyStart = { x: 0, y: 0 };
const joyMaxRadius = 35;

joyZone.addEventListener('touchstart', (e) => {
    joyActive = true;
    const touch = e.touches[0];
    const rect = joyZone.getBoundingClientRect();
    joyStart = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    updateJoystick(touch);
}, { passive: false });

window.addEventListener('touchmove', (e) => {
    if (!joyActive) return;
    for (let touch of e.touches) {
        if (touch.target === joyZone || joyActive) {
            updateJoystick(touch);
            break;
        }
    }
}, { passive: false });

window.addEventListener('touchend', () => {
    joyActive = false;
    input.x = 0;
    joyKnob.style.transform = `translate(0px, 0px)`;
});

function updateJoystick(touch) {
    let dx = touch.clientX - joyStart.x;
    let dist = Math.abs(dx);

    if (dist > joyMaxRadius) {
        dx = (dx / dist) * joyMaxRadius;
    }

    joyKnob.style.transform = `translate(${dx}px, 0px)`;
    input.x = dx / joyMaxRadius;
}

function bindBtn(id, key) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); input[key] = true; });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); input[key] = false; });
}
bindBtn('btn-atk', 'atk');
bindBtn('btn-skill', 'skill');
bindBtn('btn-jump', 'jump');

// --- 캐릭터 및 더미 클래스 ---
class Player {
    constructor() {
        this.width = 24;
        this.height = 40;
        this.x = size * 0.25;
        this.y = GROUND_Y - this.height;
        this.vx = 0;
        this.vy = 0;
        this.speed = 3;
        this.facing = 1; // 1: 우, -1: 좌
        this.isGrounded = true;
        this.state = 'idle';
        this.atkTimer = 0;
        this.weaponAngle = 0;
        this.animTimer = 0;
    }

    update() {
        // 2D 좌우 이동
        if (this.state !== 'attack' && this.state !== 'skill') {
            this.x += input.x * this.speed;
            if (Math.abs(input.x) > 0.1) {
                this.facing = input.x > 0 ? 1 : -1;
            }
        }

        // 2D 점프
        if (input.jump && this.isGrounded) {
            this.vy = -9;
            this.isGrounded = false;
            input.jump = false;
        }

        // 2D 중력
        this.y += this.vy;
        if (!this.isGrounded) {
            this.vy += 0.5;
            if (this.y >= GROUND_Y - this.height) {
                this.y = GROUND_Y - this.height;
                this.vy = 0;
                this.isGrounded = true;
            }
        }

        // 화면 밖 제한
        this.x = Math.max(10, Math.min(size - this.width - 10, this.x));

        // 공격 및 스킬 (2.5D 이펙트 트리거)
        if (input.atk && this.atkTimer === 0) {
            this.state = 'attack';
            this.atkTimer = 12;
            this.weaponAngle = -Math.PI / 3;
            triggerHitbox(this.x + (this.facing === 1 ? this.width + 10 : -30), this.y + 10, 35, 10, false);
            input.atk = false;
        }

        if (input.skill && this.atkTimer === 0) {
            this.state = 'skill';
            this.atkTimer = 24;
            triggerHitbox(this.x + this.width / 2, this.y + this.height / 2, 60, 25, true);
            input.skill = false;
        }

        if (this.atkTimer > 0) {
            this.atkTimer--;
            if (this.state === 'attack') {
                this.weaponAngle += (Math.PI / 6) * this.facing;
            } else if (this.state === 'skill') {
                this.weaponAngle += Math.PI / 3;
            }
            if (this.atkTimer === 0) this.state = 'idle';
        }

        this.animTimer++;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x + this.width / 2, this.y + this.height);

        // 2D 순수 도트 캐릭터 (검은 윤곽선)
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#000000';

        // 머리
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-8, -38, 16, 16);
        ctx.strokeRect(-8, -38, 16, 16);

        // 눈 (도트)
        ctx.fillStyle = '#000000';
        let eyePos = this.facing === 1 ? 2 : -5;
        ctx.fillRect(eyePos, -33, 3, 3);

        // 몸통
        let legOffset = Math.sin(this.animTimer * 0.3) * (Math.abs(input.x) > 0.1 ? 3 : 0);
        ctx.fillStyle = '#000000';
        ctx.fillRect(-6, -22, 12, 14);

        // 다리 (2D)
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-5 + legOffset, -8, 4, 8);
        ctx.strokeRect(-5 + legOffset, -8, 4, 8);
        ctx.fillRect(1 - legOffset, -8, 4, 8);
        ctx.strokeRect(1 - legOffset, -8, 4, 8);

        // 무기 (기본)
        ctx.save();
        ctx.translate(0, -15);
        if (this.state === 'attack' || this.state === 'skill') {
            ctx.rotate(this.weaponAngle);
        } else {
            ctx.rotate((this.facing * Math.PI) / 4);
        }

        ctx.fillStyle = '#000';
        ctx.fillRect(0, -2, 3, 5);
        ctx.fillStyle = '#fff';
        ctx.fillRect(3, -2, 20, 4);
        ctx.strokeRect(3, -2, 20, 4);
        ctx.restore();

        ctx.restore();
    }
}

class Dummy {
    constructor() {
        this.width = 24;
        this.height = 40;
        this.x = size * 0.7;
        this.y = GROUND_Y - this.height;
        this.hp = 100;
        this.maxHp = 100;
        this.hitTimer = 0;
        this.vx = 0;
    }

    update() {
        // 2D 넉백 및 감쇄
        this.x += this.vx;
        this.vx *= 0.8;
        this.x = Math.max(size * 0.4, Math.min(size - this.width - 10, this.x));

        if (this.hitTimer > 0) this.hitTimer--;

        // HP 자동 회복
        if (this.hp < this.maxHp && this.hitTimer === 0) {
            this.hp += 0.2;
        }

        document.getElementById('dummy-hp').style.width = `${(this.hp / this.maxHp) * 100}%`;
    }

    draw() {
        ctx.save();
        let shake = this.hitTimer > 0 ? (Math.random() - 0.5) * 4 : 0;
        ctx.translate(this.x + shake, this.y);

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#000';
        ctx.fillStyle = this.hitTimer > 0 ? '#ff4444' : '#eee';

        // 2D 더미 샌드백
        ctx.fillRect(0, 0, this.width, this.height);
        ctx.strokeRect(0, 0, this.width, this.height);

        // X 표시
        ctx.beginPath();
        ctx.moveTo(6, 10); ctx.lineTo(18, 20);
        ctx.moveTo(18, 10); ctx.lineTo(6, 20);
        ctx.stroke();

        ctx.restore();
    }
}

// --- 2.5D 이펙트 연출 시스템 ---
const particles = [];
const fxRings = [];

function triggerHitbox(x, y, range, damage, isSpin) {
    // 더미 피격 체크
    let dx = (dummy.x + dummy.width / 2) - x;
    let dy = (dummy.y + dummy.height / 2) - y;
    let dist = Math.hypot(dx, dy);

    if (dist < range) {
        dummy.hp = Math.max(0, dummy.hp - damage);
        dummy.hitTimer = 8;
        dummy.vx = player.facing * 5;
    }

    // [2.5D 이펙트 1] 입체 원형 스핀 링 (타원/Perspective 변형 연출)
    if (isSpin) {
        fxRings.push({ x, y, radius: 10, maxRadius: 45, alpha: 1, angleX: 1.2 });
    }

    // [2.5D 이펙트 2] 3D 파티클 팝업 (Z축 깊이 방향 스파크)
    for (let i = 0; i < (isSpin ? 16 : 8); i++) {
        let angle = (Math.PI * 2 * i) / (isSpin ? 16 : 8);
        let speed = Math.random() * 4 + 2;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed * 0.5, // 2.5D 입체감을 위해 Y축 속도 조절
            vz: Math.random() * 3 + 1, // Z축 높이
            z: 0,
            size: Math.random() * 4 + 2,
            life: 14
        });
    }
}

function updateAndDraw25DEffects() {
    // 2.5D 스핀 링 렌더링
    for (let i = fxRings.length - 1; i >= 0; i--) {
        let ring = fxRings[i];
        ctx.save();
        ctx.translate(ring.x, ring.y);
        ctx.scale(1, 0.4); // Y축 축소로 2.5D 타원 시점 형성
        ctx.lineWidth = 3;
        ctx.strokeStyle = `rgba(0, 0, 0, ${ring.alpha})`;
        ctx.beginPath();
        ctx.arc(0, 0, ring.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        ring.radius += 3;
        ring.alpha -= 0.08;
        if (ring.alpha <= 0) fxRings.splice(i, 1);
    }

    // 2.5D 입체 파티클 렌더링
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.z += p.vz;
        p.vz -= 0.3; // Gravity for particle Z height
        p.life--;

        // Z축 높이를 반영한 Y 위치 투영
        let renderY = p.y - p.z;

        ctx.fillStyle = '#000000';
        ctx.fillRect(p.x, renderY, p.size, p.size);

        if (p.life <= 0) particles.splice(i, 1);
    }
}

// --- 단순 2D 배경 ---
function draw2DBackground() {
    ctx.clearRect(0, 0, size, size);

    // 단순 바닥 수평선 (2D 전용)
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(size, GROUND_Y);
    ctx.stroke();
}

// --- 루프 ---
const player = new Player();
const dummy = new Dummy();

function loop() {
    player.update();
    dummy.update();

    draw2DBackground();
    dummy.draw();
    player.draw();
    updateAndDraw25DEffects();

    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
