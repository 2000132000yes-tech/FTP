<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Pixel Fighter - 4-Hit Combo & Advanced Mechanics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        #game-wrapper {
            position: relative;
            margin-top: 10px;
            border: 3px solid #000;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-weight: bold;
            font-size: 12px;
            color: #000;
        }

        .bar-container {
            width: 100%;
            background: #eee;
            border: 2px solid #000;
            height: 14px;
            margin-top: 2px;
        }

        .bar-fill {
            height: 100%;
            background: #000;
            width: 100%;
            transition: width 0.1s linear;
        }

        .dummy-bar {
            background: #ff4444;
        }

        #controls-area {
            width: 100%;
            max-width: 450px;
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-sizing: border-box;
        }

        #joystick-zone {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.03);
            border: 2px dashed #999;
            position: relative;
            touch-action: none;
        }

        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            margin-top: -20px;
            margin-left: -20px;
            border-radius: 50%;
            background: #000;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .action-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #000;
            color: #000;
            font-weight: 900;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #000;
            touch-action: manipulation;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
            background: #000;
            color: #fff;
        }

        .btn-atk { width: 65px; height: 65px; font-size: 15px; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>

        <div id="hud">
            <div style="width: 42%;">
                PLAYER
                <div class="bar-container"><div id="player-hp" class="bar-fill"></div></div>
            </div>
            <div style="width: 42%; text-align: right;">
                DUMMY
                <div class="bar-container" style="margin-left: auto;"><div id="dummy-hp" class="bar-fill dummy-bar"></div></div>
            </div>
        </div>
    </div>

    <div id="controls-area">
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
        <div class="btn-group">
            <button class="action-btn" id="btn-jump">JUMP</button>
            <button class="action-btn" id="btn-skill">SKILL</button>
            <button class="action-btn btn-atk" id="btn-atk">ATK</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('game-wrapper');

let size = 300;
function resizeGame() {
    size = Math.min(window.innerWidth - 20, window.innerHeight * 0.55);
    size = Math.max(280, Math.min(size, 450));
    wrapper.style.width = size + 'px';
    wrapper.style.height = size + 'px';
    canvas.width = size;
    canvas.height = size;
}
window.addEventListener('resize', resizeGame);
resizeGame();

const GROUND_Y = size * 0.8;

// --- 멀티터치 및 입력 관리 ---
const input = { x: 0, atk: false, skill: false, jump: false };

const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
let joyTouchId = null;
let joyStart = { x: 0, y: 0 };
const joyMaxRadius = 35;

joyZone.addEventListener('touchstart', (e) => {
    if (joyTouchId === null) {
        const touch = e.changedTouches[0];
        joyTouchId = touch.identifier;
        const rect = joyZone.getBoundingClientRect();
        joyStart = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        updateJoystick(touch);
    }
    e.preventDefault();
}, { passive: false });

window.addEventListener('touchmove', (e) => {
    if (joyTouchId === null) return;
    for (let touch of e.changedTouches) {
        if (touch.identifier === joyTouchId) {
            updateJoystick(touch);
            break;
        }
    }
}, { passive: false });

window.addEventListener('touchend', (e) => {
    if (joyTouchId === null) return;
    for (let touch of e.changedTouches) {
        if (touch.identifier === joyTouchId) {
            joyTouchId = null;
            input.x = 0;
            joyKnob.style.transform = `translate(0px, 0px)`;
            break;
        }
    }
});

function updateJoystick(touch) {
    let dx = touch.clientX - joyStart.x;
    let dist = Math.abs(dx);
    if (dist > joyMaxRadius) dx = (dx / dist) * joyMaxRadius;
    joyKnob.style.transform = `translate(${dx}px, 0px)`;
    input.x = dx / joyMaxRadius;
}

function bindBtn(id, key) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { 
        e.preventDefault(); 
        input[key] = true; 
        if (key === 'jump') handleJumpInput();
    });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); input[key] = false; });
}
bindBtn('btn-atk', 'atk');
bindBtn('btn-skill', 'skill');
bindBtn('btn-jump', 'jump');

// --- 화면 흔들림 및 텍스트 ---
let screenShakeTimer = 0;
let screenShakeIntensity = 0;
function triggerShake(duration, intensity) {
    screenShakeTimer = duration;
    screenShakeIntensity = intensity;
}

const damageTexts = [];
function addDamageText(x, y, text, isCritical = false) {
    damageTexts.push({
        x: x + (Math.random() - 0.5) * 15,
        y: y - 20,
        text: text,
        life: 25,
        color: isCritical ? '#ff0000' : '#000000',
        scale: isCritical ? 1.3 : 1.0
    });
}

// 잔상 저장 배열
const swordTrails = [];

// --- 플레이어 클래스 ---
class Player {
    constructor() {
        this.width = 28;
        this.height = 42;
        this.x = size * 0.25;
        this.y = GROUND_Y - this.height;
        this.vy = 0;
        this.speed = 3.2;
        this.facing = 1;
        this.isGrounded = true;

        // 전투 상태 변수
        this.state = 'idle'; // idle, attack, skill
        this.comboStep = 1; // 1 ~ 4단 평타
        this.atkAnimTimer = 0;
        
        // 4타 후 점프 런처 판정용
        this.canLauncherWindow = false;
        this.launcherWindowTimer = 0;

        // 1스킬 지속 공격 관리
        this.skillTimer = 0;
        this.skillHitInterval = 0;

        // 홀드(공중 멈춤) 상태
        this.isHoldAction = false;
        this.holdTimer = 0;

        this.frameCounter = 0; // 모든 애니메이션 8프레임 엄격 적용
    }

    update() {
        // 공중 홀드 상태(공중에서 맞추고 멈춰있는 상태) 처리
        if (this.isHoldAction) {
            this.holdTimer--;
            if (this.holdTimer <= 0) {
                this.isHoldAction = false;
            }
            return;
        }

        // 스킬 사용 중 이동 및 지속 틱 데미지 처리
        if (this.state === 'skill') {
            // 스킬 중 이동 가능
            this.x += input.x * (this.speed * 0.7);
            this.x = Math.max(10, Math.min(size - this.width - 10, this.x));

            this.skillTimer--;
            this.skillHitInterval++;

            // 돌리는 시간 동안 맞으면 조금씩 위로 띄우며 지속 데미지
            if (this.skillHitInterval >= 6) {
                this.skillHitInterval = 0;
                triggerSkillTick();
            }

            if (this.skillTimer <= 0) {
                this.state = 'idle';
            }
            return;
        }

        // 일반 이동 (8프레임 엄격 연동)
        if (this.state !== 'attack') {
            this.x += input.x * this.speed;
            if (Math.abs(input.x) > 0.1) {
                this.facing = input.x > 0 ? 1 : -1;
                this.frameCounter++;
            } else {
                this.frameCounter = 0;
            }
        }

        // 점프
        if (input.jump && this.isGrounded) {
            this.vy = -9.5;
            this.isGrounded = false;
            input.jump = false;
        }

        // 중력
        this.y += this.vy;
        if (!this.isGrounded) {
            this.vy += 0.55;
            if (this.y >= GROUND_Y - this.height) {
                this.y = GROUND_Y - this.height;
                this.vy = 0;
                this.isGrounded = true;
            }
        }

        this.x = Math.max(10, Math.min(size - this.width - 10, this.x));

        // 4타 후 점프키 런처 윈도우 타이머 갱신
        if (this.canLauncherWindow) {
            this.launcherWindowTimer--;
            if (this.launcherWindowTimer <= 0) {
                this.canLauncherWindow = false;
            }
        }

        // 평타 입력 처리 (총 4번의 애니메이션 분할)
        if (input.atk && this.state !== 'attack') {
            this.state = 'attack';
            this.atkAnimTimer = 12; // 8프레임 기준 애니메이션 길이
            
            // 4단 콤보 실행
            executeAttackCombo(this.comboStep);
            
            input.atk = false;
        }

        if (this.state === 'attack') {
            this.atkAnimTimer--;
            if (this.atkAnimTimer <= 0) {
                this.state = 'idle';
                this.comboStep++;
                if (this.comboStep > 4) {
                    this.comboStep = 1; // 4타 후 초기화
                }
            }
        }

        // 스킬 입력 처리 (1스킬: 쓰면서 움직임)
        if (input.skill) {
            this.state = 'skill';
            this.skillTimer = 50; // 지속 시간
            this.skillHitInterval = 0;
            input.skill = false;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x + this.width / 2, this.y + this.height);

        // --- 8프레임 완벽 연동 애니메이션 ---
        let animFrame = Math.floor((this.frameCounter / 4) % 8);
        let bounce = Math.abs(Math.sin(animFrame * (Math.PI / 4))) * 2.5;
        if (Math.abs(input.x) < 0.1 && this.state === 'idle') bounce = 0;

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#000000';

        // 머리 (8프레임 도트)
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-9, -40 - bounce, 18, 16);
        ctx.strokeRect(-9, -40 - bounce, 18, 16);

        // 눈
        ctx.fillStyle = '#000000';
        let eyePos = this.facing === 1 ? 2 : -6;
        ctx.fillRect(eyePos, -35 - bounce, 4, 4);

        // 몸통
        ctx.fillStyle = this.state === 'skill' ? '#333333' : '#000000';
        ctx.fillRect(-7, -24 - bounce, 14, 15);

        // 8프레임 다리
        ctx.fillStyle = '#ffffff';
        let legOffsetA = Math.sin(animFrame * (Math.PI / 4)) * 3.5;
        let legOffsetB = -legOffsetA;
        ctx.fillRect(-6 + legOffsetA, -9, 5, 9);
        ctx.strokeRect(-6 + legOffsetA, -9, 5, 9);
        ctx.fillRect(1 + legOffsetB, -9, 5, 9);
        ctx.strokeRect(1 + legOffsetB, -9, 5, 9);

        // --- 새로 디자인된 검 (정교한 픽셀 도트 칼 모델) ---
        ctx.save();
        ctx.translate(0, -16 - bounce);
        
        let swordAngle = 0;
        if (this.state === 'attack') {
            let progress = (12 - this.atkAnimTimer) / 12; // 0 ~ 1
            swordAngle = (progress * Math.PI * 1.2 - 0.5) * this.facing;
        } else if (this.state === 'skill') {
            swordAngle = (Date.now() / 40) * this.facing; // 스킬 시 회전
        } else {
            swordAngle = (this.facing * Math.PI) / 6;
        }
        ctx.rotate(swordAngle);

        // 도트 검 모델 렌더링 (자루, 코스가드, 날)
        ctx.fillStyle = '#553311'; // 검자루
        ctx.fillRect(-2, 0, 4, 8);
        ctx.fillStyle = '#111111'; // 코스가드
        ctx.fillRect(-6, 0, 12, 3);
        ctx.fillStyle = '#ffffff'; // 칼날 (검은 윤곽선)
        ctx.fillRect(-3, -22, 6, 22);
        ctx.strokeRect(-3, -22, 6, 22);
        ctx.fillStyle = '#cccccc'; // 칼날 내부 광택
        ctx.fillRect(-1, -20, 2, 18);

        // 칼 휘두를 때 검 잔상(Trail) 생성 기록
        if (this.state === 'attack' || this.state === 'skill') {
            let tipX = this.x + this.width/2 + Math.cos(swordAngle) * 25 * this.facing;
            let tipY = this.y + this.height - 16 - bounce + Math.sin(swordAngle) * 25;
            swordTrails.push({ x: tipX, y: tipY, alpha: 0.6 });
        }

        ctx.restore();
        ctx.restore();
    }
}

// --- 더미 클래스 (피격, 넉백, 공중 체공 관리) ---
class Dummy {
    constructor() {
        this.width = 28;
        this.height = 42;
        this.x = size * 0.7;
        this.y = GROUND_Y - this.height;
        this.vy = 0;
        this.hp = 100;
        this.maxHp = 100;
        this.hitTimer = 0;
        this.vx = 0;
        this.isAirborne = false; // 공중에 뜸 상태
        this.isHold = false;     // 스킬 공중 맞춤 홀드 상태
        this.holdTimer = 0;
    }

    update() {
        if (this.isHold) {
            this.holdTimer--;
            if (this.holdTimer <= 0) {
                this.isHold = false;
            }
            return;
        }

        this.x += this.vx;
        this.vx *= 0.8;
        this.x = Math.max(size * 0.4, Math.min(size - this.width - 10, this.x));

        // 공중 체공 및 낙하 처리
        if (this.isAirborne) {
            this.y += this.vy;
            this.vy += 0.5;
            if (this.y >= GROUND_Y - this.height) {
                this.y = GROUND_Y - this.height;
                this.vy = 0;
                this.isAirborne = false;
            }
        }

        if (this.hitTimer > 0) this.hitTimer--;
        if (this.hp < this.maxHp && this.hitTimer === 0 && !this.isAirborne) {
            this.hp += 0.2;
        }
        document.getElementById('dummy-hp').style.width = `${(this.hp / this.maxHp) * 100}%`;
    }

    draw() {
        ctx.save();
        let shake = this.hitTimer > 0 ? (Math.random() - 0.5) * 5 : 0;
        ctx.translate(this.x + shake, this.y);

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#000';
        ctx.fillStyle = this.hitTimer > 0 ? '#ff4444' : '#eeeeee';

        ctx.fillRect(0, 0, this.width, this.height);
        ctx.strokeRect(0, 0, this.width, this.height);

        ctx.beginPath();
        ctx.moveTo(7, 10); ctx.lineTo(21, 22);
        ctx.moveTo(21, 10); ctx.lineTo(7, 22);
        ctx.stroke();

        ctx.restore();
    }
}

// --- 4단 콤보 및 메카닉 로직 ---
function executeAttackCombo(step) {
    let damage = 8 + step * 3; // 타수에 따라 데미지 증가
    let range = 45;

    let dx = (dummy.x + dummy.width / 2) - (player.x + player.width / 2);
    let dy = Math.abs((dummy.y + dummy.height / 2) - (player.y + player.height / 2));

    if (Math.abs(dx) < range && dy < 40) {
        dummy.hp = Math.max(0, dummy.hp - damage);
        dummy.hitTimer = 10;
        addDamageText(dummy.x + dummy.width / 2, dummy.y, damage, step === 4);

        if (step < 4) {
            // 1~3타: 조금씩 밀림
            dummy.vx = player.facing * 3;
            player.canLauncherWindow = false;
        } else {
            // 4타: 상대를 크게 밀치고 0.7초 동안 점프키로 띄울 수 있는 창(Window) 열기
            dummy.vx = player.facing * 9;
            player.canLauncherWindow = true;
            player.launcherWindowTimer = 42; // 0.7초 (60fps 기준 약 42프레임)
            triggerShake(6, 4);
        }
    }
}

// 4타 후 0.7초 이내 점프키 입력 시 상대 공중 띄우기 (Launcher)
function handleJumpInput() {
    if (player.canLauncherWindow) {
        let dx = Math.abs((dummy.x + dummy.width / 2) - (player.x + player.width / 2));
        if (dx < 70) {
            dummy.isAirborne = true;
            dummy.vy = -11; // 상대를 공중으로 확 띄움
            player.canLauncherWindow = false;
            addDamageText(dummy.x + dummy.width / 2, dummy.y - 15, "LAUNCHER!", true);
            triggerShake(8, 5);
        }
    }
}

// 1스킬 지속 틱 데미지 (맞으면 살짝 위로 띄우며 지속 타격)
function triggerSkillTick() {
    let dx = (dummy.x + dummy.width / 2) - (player.x + player.width / 2);
    let dy = Math.abs((dummy.y + dummy.height / 2) - (player.y + player.height / 2));

    if (Math.abs(dx) < 65 && dy < 50) {
        dummy.hp = Math.max(0, dummy.hp - 4);
        dummy.hitTimer = 6;
        addDamageText(dummy.x + dummy.width / 2, dummy.y, 4);

        // 공중에서 맞추면 나와 상대가 그 자리에 지속시간까지 가만히 멈춰서 계속 때림
        if (!dummy.isAirborne && player.y < GROUND_Y - player.height - 10) {
            dummy.isHold = true;
            dummy.holdTimer = 25;
            player.isHoldAction = true;
            player.holdTimer = 25;
            addDamageText(dummy.x, dummy.y - 30, "AIR LOCK!", true);
        } else {
            // 지상에서도 살짝 위로 띄우며 지속 타격
            dummy.y -= 2;
            dummy.vx = player.facing * 1.5;
        }
    }
}

// --- 이펙트 및 잔상 렌더링 ---
function updateAndDrawEffects() {
    // 칼 잔상 (Trail) 렌더링
    for (let i = swordTrails.length - 1; i >= 0; i--) {
        let t = swordTrails[i];
        ctx.fillStyle = `rgba(0, 0, 0, ${t.alpha})`;
        ctx.fillRect(t.x, t.y, 4, 4);
        t.alpha -= 0.12;
        if (t.alpha <= 0) swordTrails.splice(i, 1);
    }

    // 데미지 텍스트 렌더링
    for (let i = damageTexts.length - 1; i >= 0; i--) {
        let dt = damageTexts[i];
        ctx.save();
        ctx.font = `bold ${Math.round(14 * dt.scale)}px monospace`;
        ctx.fillStyle = dt.color;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.strokeText(`-${dt.text}`, dt.x, dt.y);
        ctx.fillText(`-${dt.text}`, dt.x, dt.y);
        ctx.restore();

        dt.y -= 1.2;
        dt.life--;
        if (dt.life <= 0) damageTexts.splice(i, 1);
    }
}

function drawBackground() {
    ctx.clearRect(0, 0, size, size);

    if (screenShakeTimer > 0) {
        let sx = (Math.random() - 0.5) * screenShakeIntensity;
        let sy = (Math.random() - 0.5) * screenShakeIntensity;
        ctx.translate(sx, sy);
        screenShakeTimer--;
    }

    // 바닥 선
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(size, GROUND_Y);
    ctx.stroke();
}

// --- 메인 루프 ---
const player = new Player();
const dummy = new Dummy();

function loop() {
    ctx.save();
    
    player.update();
    dummy.update();

    drawBackground();
    dummy.draw();
    player.draw();
    updateAndDrawEffects();

    ctx.restore();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
