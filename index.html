<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2D Fighting Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111111;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 500px;
            max-width: 100vw;
            max-height: 100vh;
            background-color: #222222;
            border: 4px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }

        .controls-info {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: #888;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="ui-overlay">
            <div id="p1Score">P1 승리: 0</div>
            <div id="timer">60</div>
            <div id="p2Score">P2 승리: 0</div>
        </div>
        <div class="controls-info">
            P1: 이동(A/D), 점프(W), 공격(J) | P2: 이동(방향키 좌/우), 점프(위), 공격(1 또는 숫자패드 1)
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const p1ScoreEl = document.getElementById('p1Score');
        const p2ScoreEl = document.getElementById('p2Score');
        const timerEl = document.getElementById('timer');

        let p1Wins = 0;
        let p2Wins = 0;
        let timeLeft = 60;
        let matchOver = false;

        setInterval(() => {
            if (!matchOver && timeLeft > 0) {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft === 0) {
                    checkWinner(true);
                }
            }
        }, 1000);

        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        class Fighter {
            constructor(x, y, color, isPlayer1) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 70;
                this.color = color;
                this.isPlayer1 = isPlayer1;
                
                this.vx = 0;
                this.vy = 0;
                this.speed = 5;
                this.jumpForce = -12;
                this.gravity = 0.6;
                
                this.hp = 100;
                this.isGrounded = false;
                this.isAttacking = false;
                this.attackTimer = 0;
                this.facing = isPlayer1 ? 1 : -1;
            }

            update(opponent) {
                if (matchOver) return;

                // 이동 입력
                if (this.isPlayer1) {
                    if (keys['KeyA']) {
                        this.vx = -this.speed;
                        this.facing = -1;
                    } else if (keys['KeyD']) {
                        this.vx = this.speed;
                        this.facing = 1;
                    } else {
                        this.vx = 0;
                    }

                    if (keys['KeyW'] && this.isGrounded) {
                        this.vy = this.jumpForce;
                        this.isGrounded = false;
                    }

                    if (keys['KeyJ'] && !this.isAttacking) {
                        this.attack(opponent);
                    }
                } else {
                    if (keys['ArrowLeft']) {
                        this.vx = -this.speed;
                        this.facing = -1;
                    } else if (keys['ArrowRight']) {
                        this.vx = this.speed;
                        this.facing = 1;
                    } else {
                        this.vx = 0;
                    }

                    if (keys['ArrowUp'] && this.isGrounded) {
                        this.vy = this.jumpForce;
                        this.isGrounded = false;
                    }

                    if (keys['Numpad1'] || keys['Digit1'] && !this.isAttacking) {
                        this.attack(opponent);
                    }
                }

                // 물리 적용
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;

                // 바닥 충돌
                const floorY = 400;
                if (this.y + this.height > floorY) {
                    this.y = floorY - this.height;
                    this.vy = 0;
                    this.isGrounded = true;
                }

                // 화면 벽 충돌
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

                // 공격 지속시간 관리
                if (this.isAttacking) {
                    this.attackTimer--;
                    if (this.attackTimer <= 0) {
                        this.isAttacking = false;
                    }
                }
            }

            attack(opponent) {
                this.isAttacking = true;
                this.attackTimer = 15; // 공격 지속 프레임

                // 공격 판정 (사각형 박스 체크)
                const attackBox = {
                    x: this.facing === 1 ? this.x + this.width : this.x - 50,
                    y: this.y + 10,
                    width: 50,
                    height: 30
                };

                if (
                    attackBox.x < opponent.x + opponent.width &&
                    attackBox.x + attackBox.width > opponent.x &&
                    attackBox.y < opponent.y + opponent.height &&
                    attackBox.y + attackBox.height > opponent.y
                ) {
                    opponent.hp -= 10;
                    opponent.vx = this.facing * 8; // 넉백 효과
                    opponent.vy = -4;

                    if (opponent.hp <= 0) {
                        opponent.hp = 0;
                        checkWinner(false);
                    }
                }
            }

            draw() {
                // 몸체 (네모)
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // 머리 (동그라미)
                ctx.beginPath();
                ctx.arc(this.x + this.width / 2, this.y - 15, 15, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();

                // 공격 시 삼각형 무기 표시
                if (this.isAttacking) {
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath();
                    const weaponX = this.facing === 1 ? this.x + this.width + 25 : this.x - 25;
                    const weaponY = this.y + 25;
                    ctx.moveTo(weaponX, weaponY - 15);
                    ctx.lineTo(weaponX + (this.facing * 25), weaponY);
                    ctx.lineTo(weaponX, weaponY + 15);
                    ctx.fill();
                    ctx.closePath();
                }

                // 체력바
                ctx.fillStyle = '#555';
                ctx.fillRect(this.isPlayer1 ? 50 : 550, 60, 200, 20);
                ctx.fillStyle = '#00ff66';
                ctx.fillRect(this.isPlayer1 ? 50 : 550, 60, 2 * this.hp, 20);
                ctx.strokeStyle = '#fff';
                ctx.strokeRect(this.isPlayer1 ? 50 : 550, 60, 200, 20);
            }
        }

        const p1 = new Fighter(150, 300, '#ff4d4d', true);
        const p2 = new Fighter(600, 300, '#4da6ff', false);

        function checkWinner(byTime) {
            if (matchOver) return;
            matchOver = true;

            if (p1.hp > p2.hp) {
                p1Wins++;
                p1ScoreEl.textContent = `P1 승리: ${p1Wins}`;
            } else if (p2.hp > p1.hp) {
                p2Wins++;
                p2ScoreEl.textContent = `P2 승리: ${p2Wins}`;
            }

            setTimeout(resetMatch, 2000);
        }

        function resetMatch() {
            p1.x = 150; p1.y = 300; p1.hp = 100; p1.vx = 0; p1.vy = 0;
            p2.x = 600; p2.y = 300; p2.hp = 100; p2.vx = 0; p2.vy = 0;
            timeLeft = 60;
            timerEl.textContent = timeLeft;
            matchOver = false;
        }

        function gameLoop() {
            // 화면 지우기
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 바닥 그리기
            ctx.fillStyle = '#444';
            ctx.fillRect(0, 400, canvas.width, 100);

            p1.update(p2);
            p2.update(p1);

            p1.draw();
            p2.draw();

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
