<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Pixel Fighter - 8 Frame Dot & 2.5D FX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        #game-wrapper {
            position: relative;
            margin-top: 10px;
            border: 3px solid #000;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-weight: bold;
            font-size: 12px;
            color: #000;
        }

        .bar-container {
            width: 100%;
            background: #eee;
            border: 2px solid #000;
            height: 14px;
            margin-top: 2px;
        }

        .bar-fill {
            height: 100%;
            background: #000;
            width: 100%;
            transition: width 0.1s linear;
        }

        .dummy-bar {
            background: #ff4444;
        }

        #controls-area {
            width: 100%;
            max-width: 450px;
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-sizing: border-box;
        }

        #joystick-zone {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.03);
            border: 2px dashed #999;
            position: relative;
            touch-action: none;
        }

        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            margin-top: -20px;
            margin-left: -20px;
            border-radius: 50%;
            background: #000;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .action-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #000;
            color: #000;
            font-weight: 900;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #000;
            touch-action: manipulation;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
            background: #000;
            color: #fff;
        }

        .btn-atk { width: 65px; height: 65px; font-size: 15px; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>

        <div id="hud">
            <div style="width: 42%;">
                PLAYER
                <div class="bar-container"><div id="player-hp" class="bar-fill"></div></div>
            </div>
            <div style="width: 42%; text-align: right;">
                DUMMY
                <div class="bar-container" style="margin-left: auto;"><div id="dummy-hp" class="bar-fill dummy-bar"></div></div>
            </div>
        </div>
    </div>

    <div id="controls-area">
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
        <div class="btn-group">
            <button class="action-btn" id="btn-jump">JUMP</button>
            <button class="action-btn" id="btn-skill">SKILL</button>
            <button class="action-btn btn-atk" id="btn-atk">ATK</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('game-wrapper');

let size = 300;
function resizeGame() {
    size = Math.min(window.innerWidth - 20, window.innerHeight * 0.55);
    size = Math.max(280, Math.min(size, 450));
    wrapper.style.width = size + 'px';
    wrapper.style.height = size + 'px';
    canvas.width = size;
    canvas.height = size;
}
window.addEventListener('resize', resizeGame);
resizeGame();

const GROUND_Y = size * 0.8;

// --- 입력 관리 (멀티터치/동시입력 완벽 대응) ---
const input = { x: 0, atk: false, skill: false, jump: false };

const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
let joyTouchId = null;
let joyStart = { x: 0, y: 0 };
const joyMaxRadius = 35;

joyZone.addEventListener('touchstart', (e) => {
    if (joyTouchId === null) {
        const touch = e.changedTouches[0];
        joyTouchId = touch.identifier;
        const rect = joyZone.getBoundingClientRect();
        joyStart = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        updateJoystick(touch);
    }
    e.preventDefault();
}, { passive: false });

window.addEventListener('touchmove', (e) => {
    if (joyTouchId === null) return;
    for (let touch of e.changedTouches) {
        if (touch.identifier === joyTouchId) {
            updateJoystick(touch);
            break;
        }
    }
}, { passive: false });

window.addEventListener('touchend', (e) => {
    if (joyTouchId === null) return;
    for (let touch of e.changedTouches) {
        if (touch.identifier === joyTouchId) {
            joyTouchId = null;
            input.x = 0;
            joyKnob.style.transform = `translate(0px, 0px)`;
            break;
        }
    }
});

function updateJoystick(touch) {
    let dx = touch.clientX - joyStart.x;
    let dist = Math.abs(dx);
    if (dist > joyMaxRadius) dx = (dx / dist) * joyMaxRadius;
    joyKnob.style.transform = `translate(${dx}px, 0px)`;
    input.x = dx / joyMaxRadius;
}

function bindBtn(id, key) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); input[key] = true; });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); input[key] = false; });
}
bindBtn('btn-atk', 'atk');
bindBtn('btn-skill', 'skill');
bindBtn('btn-jump', 'jump');

// --- 화면 흔들림(Screen Shake) 시스템 ---
let screenShakeTimer = 0;
let screenShakeIntensity = 0;

function triggerShake(duration, intensity) {
    screenShakeTimer = duration;
    screenShakeIntensity = intensity;
}

// --- 데미지 텍스트 시스템 ---
const damageTexts = [];
function addDamageText(x, y, text, isCritical = false) {
    damageTexts.push({
        x: x + (Math.random() - 0.5) * 20,
        y: y - 20,
        text: text,
        life: 25,
        color: isCritical ? '#ff0000' : '#000000',
        scale: isCritical ? 1.4 : 1.0
    });
}

// --- 플레이어 클래스 (8프레임 도트 애니메이션) ---
class Player {
    constructor() {
        this.width = 28;
        this.height = 42;
        this.x = size * 0.25;
        this.y = GROUND_Y - this.height;
        this.vy = 0;
        this.speed = 3.2;
        this.facing = 1;
        this.isGrounded = true;
        this.state = 'idle';
        this.atkTimer = 0;
        this.weaponAngle = 0;
        this.frameCounter = 0; // 8프레임 모션 루프 카운터
    }

    update() {
        // 이동 (버튼과 동시 입력 가능)
        if (this.state !== 'attack' && this.state !== 'skill') {
            this.x += input.x * this.speed;
            if (Math.abs(input.x) > 0.1) {
                this.facing = input.x > 0 ? 1 : -1;
                this.frameCounter++; // 이동 시 프레임 증가
            }
        }

        // 점프
        if (input.jump && this.isGrounded) {
            this.vy = -9.5;
            this.isGrounded = false;
            input.jump = false;
        }

        // 중력
        this.y += this.vy;
        if (!this.isGrounded) {
            this.vy += 0.55;
            if (this.y >= GROUND_Y - this.height) {
                this.y = GROUND_Y - this.height;
                this.vy = 0;
                this.isGrounded = true;
            }
        }

        this.x = Math.max(10, Math.min(size - this.width - 10, this.x));

        // 공격 액션
        if (input.atk && this.atkTimer === 0) {
            this.state = 'attack';
            this.atkTimer = 12;
            this.weaponAngle = -Math.PI / 3;
            triggerHitbox(this.x + (this.facing === 1 ? this.width + 10 : -35), this.y + 15, 40, 12, false);
            input.atk = false;
        }

        // 스킬 액션 (화려한 2.5D 이펙트 포함)
        if (input.skill && this.atkTimer === 0) {
            this.state = 'skill';
            this.atkTimer = 24;
            triggerShake(12, 6);
            triggerHitbox(this.x + this.width / 2, this.y + this.height / 2, 70, 32, true);
            input.skill = false;
        }

        if (this.atkTimer > 0) {
            this.atkTimer--;
            if (this.state === 'attack') {
                this.weaponAngle += (Math.PI / 5) * this.facing;
            } else if (this.state === 'skill') {
                this.weaponAngle += Math.PI / 2.5;
            }
            if (this.atkTimer === 0) this.state = 'idle';
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x + this.width / 2, this.y + this.height);

        // --- 8프레임 픽셀 아트 애니메이션 계산 ---
        let animFrame = Math.floor((this.frameCounter / 6) % 8); // 8단계 세분화 프레임
        let bounce = Math.abs(Math.sin(animFrame * (Math.PI / 4))) * 3;
        if (Math.abs(input.x) < 0.1) bounce = 0;

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#000000';

        // 픽셀 머리
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-9, -40 - bounce, 18, 16);
        ctx.strokeRect(-9, -40 - bounce, 18, 16);

        // 눈 (도트)
        ctx.fillStyle = '#000000';
        let eyePos = this.facing === 1 ? 2 : -6;
        ctx.fillRect(eyePos, -35 - bounce, 4, 4);

        // 픽셀 몸통 (전투 상태별 색상 변경)
        ctx.fillStyle = this.state === 'skill' ? '#444444' : '#000000';
        ctx.fillRect(-7, -24 - bounce, 14, 15);

        // 8프레임 다리 모션
        ctx.fillStyle = '#ffffff';
        let legOffsetA = Math.sin(animFrame * (Math.PI / 4)) * 4;
        let legOffsetB = -legOffsetA;
        ctx.fillRect(-6 + legOffsetA, -9, 5, 9);
        ctx.strokeRect(-6 + legOffsetA, -9, 5, 9);
        ctx.fillRect(1 + legOffsetB, -9, 5, 9);
        ctx.strokeRect(1 + legOffsetB, -9, 5, 9);

        // 입체 무기 (검)
        ctx.save();
        ctx.translate(0, -16 - bounce);
        if (this.state === 'attack' || this.state === 'skill') {
            ctx.rotate(this.weaponAngle);
        } else {
            ctx.rotate((this.facing * Math.PI) / 4);
        }

        ctx.fillStyle = '#000';
        ctx.fillRect(0, -2, 3, 6);
        ctx.fillStyle = '#fff';
        ctx.fillRect(3, -3, 24, 6);
        ctx.strokeRect(3, -3, 24, 6);
        ctx.restore();

        ctx.restore();
    }
}

// --- 더미 클래스 ---
class Dummy {
    constructor() {
        this.width = 28;
        this.height = 42;
        this.x = size * 0.7;
        this.y = GROUND_Y - this.height;
        this.hp = 100;
        this.maxHp = 100;
        this.hitTimer = 0;
        this.vx = 0;
    }

    update() {
        this.x += this.vx;
        this.vx *= 0.8;
        this.x = Math.max(size * 0.4, Math.min(size - this.width - 10, this.x));

        if (this.hitTimer > 0) this.hitTimer--;
        if (this.hp < this.maxHp && this.hitTimer === 0) {
            this.hp += 0.25;
        }
        document.getElementById('dummy-hp').style.width = `${(this.hp / this.maxHp) * 100}%`;
    }

    draw() {
        ctx.save();
        let shake = this.hitTimer > 0 ? (Math.random() - 0.5) * 5 : 0;
        ctx.translate(this.x + shake, this.y);

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#000';
        ctx.fillStyle = this.hitTimer > 0 ? '#ff4444' : '#eeeeee';

        ctx.fillRect(0, 0, this.width, this.height);
        ctx.strokeRect(0, 0, this.width, this.height);

        // 더미 X자 마크
        ctx.beginPath();
        ctx.moveTo(7, 10); ctx.lineTo(21, 22);
        ctx.moveTo(21, 10); ctx.lineTo(7, 22);
        ctx.stroke();

        ctx.restore();
    }
}

// --- 2.5D 이펙트 및 히트 시스템 ---
const particles = [];
const fxRings = [];

function triggerHitbox(x, y, range, damage, isSpin) {
    let dx = (dummy.x + dummy.width / 2) - x;
    let dy = (dummy.y + dummy.height / 2) - y;
    let dist = Math.hypot(dx, dy);

    if (dist < range) {
        dummy.hp = Math.max(0, dummy.hp - damage);
        dummy.hitTimer = 10;
        dummy.vx = player.facing * (isSpin ? 8 : 4);
        
        // 데미지 텍스트 표기 생성 (상대방 머리 위)
        addDamageText(dummy.x + dummy.width / 2, dummy.y, Math.round(damage), isSpin);
        if (!isSpin) triggerShake(4, 3);
    }

    // [2.5D 스킬 이펙트] 입체 회전 링 웨이브
    if (isSpin) {
        fxRings.push({ x, y, radius: 10, maxRadius: 55, alpha: 1 });
    }

    // [2.5D 파티클 팝업] Z축 입체감이 느껴지는 픽셀 스파크
    for (let i = 0; i < (isSpin ? 20 : 10); i++) {
        let angle = (Math.PI * 2 * i) / (isSpin ? 20 : 10);
        let speed = Math.random() * 5 + 2;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed * 0.5,
            vz: Math.random() * 4 + 1,
            z: 0,
            size: Math.random() * 4 + 2,
            life: 18
        });
    }
}

function updateAndDrawEffects() {
    // 2.5D 회전 링
    for (let i = fxRings.length - 1; i >= 0; i--) {
        let ring = fxRings[i];
        ctx.save();
        ctx.translate(ring.x, ring.y);
        ctx.scale(1, 0.35); // 2.5D 원근 투영
        ctx.lineWidth = 3;
        ctx.strokeStyle = `rgba(0, 0, 0, ${ring.alpha})`;
        ctx.beginPath();
        ctx.arc(0, 0, ring.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        ring.radius += 4;
        ring.alpha -= 0.07;
        if (ring.alpha <= 0) fxRings.splice(i, 1);
    }

    // 2.5D 픽셀 파티클
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.z += p.vz;
        p.vz -= 0.35;
        p.life--;

        let renderY = p.y - p.z;
        ctx.fillStyle = '#000000';
        ctx.fillRect(p.x, renderY, p.size, p.size);

        if (p.life <= 0) particles.splice(i, 1);
    }

    // 데미지 텍스트 렌더링
    for (let i = damageTexts.length - 1; i >= 0; i--) {
        let dt = damageTexts[i];
        ctx.save();
        ctx.font = `bold ${Math.round(14 * dt.scale)}px monospace`;
        ctx.fillStyle = dt.color;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.strokeText(`-${dt.text}`, dt.x, dt.y);
        ctx.fillText(`-${dt.text}`, dt.x, dt.y);
        ctx.restore();

        dt.y -= 1.2;
        dt.life--;
        if (dt.life <= 0) damageTexts.splice(i, 1);
    }
}

function drawBackground() {
    ctx.clearRect(0, 0, size, size);

    // 화면 흔들림 오프셋 적용
    if (screenShakeTimer > 0) {
        let sx = (Math.random() - 0.5) * screenShakeIntensity;
        let sy = (Math.random() - 0.5) * screenShakeIntensity;
        ctx.translate(sx, sy);
        screenShakeTimer--;
    }

    // 바닥 선
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(size, GROUND_Y);
    ctx.stroke();
}

// --- 게임 루프 ---
const player = new Player();
const dummy = new Dummy();

function loop() {
    ctx.save();
    
    player.update();
    dummy.update();

    drawBackground();
    dummy.draw();
    player.draw();
    updateAndDrawEffects();

    ctx.restore();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
